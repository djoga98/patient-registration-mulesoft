# CloudHub 2.0 "dev" environment. CloudHub routes HTTPS ingress to port 8081.
# The System API is called over HTTPS at its CloudHub URL. systemApi.host is
# supplied at deployment (GitHub variable SYS_API_HOST), because CloudHub assigns
# it, e.g. patient-sys-api-abc123.5sc6y6-1.usa-e2.cloudhub.io
http:
  port: "8081"

systemApi:
  protocol: "HTTPS"
  port: "443"
# api.id, systemApi.clientId and systemApi.clientSecret (secure) are deployment
# properties: the API Manager instance ID and this app's client application for the
# System API (docs/api-manager.md). Empty client ID: no credentials are sent.
