# Settings shared by every environment. Environment files must not repeat these keys.
http:
  host: "0.0.0.0"

api:
  basePath: "/api/*"

clinic:
  # "Day of the request" for the portal's age.
  timeZone: "Europe/Sarajevo"

processApi:
  basePath: "/api"
  # Explicit timeouts for every call to the Process API (milliseconds). The response timeout
  # exceeds the Process API worst case for GET: 3 x 5000 ms System API timeout + 2 x 500 ms delay.
  connectTimeoutMillis: "3000"
  responseTimeoutMillis: "20000"
  maxConnections: "20"

retry:
  get:
    # GET only: 1 attempt + 2 retries = at most 3 attempts.
    maxRetries: "2"
    delayMillis: "500"

idempotency:
  # How long the response of a completed request is replayed for a repeated Idempotency-Key.
  ttlHours: "24"
  # An IN_PROGRESS entry older than this is abandoned (e.g. the runtime stopped mid-request)
  # and may be claimed again. Must exceed the longest POST: processApi.responseTimeoutMillis.
  inProgressTimeoutSeconds: "60"
