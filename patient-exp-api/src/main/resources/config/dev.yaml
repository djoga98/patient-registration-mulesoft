# CloudHub 2.0 "dev" environment. CloudHub routes HTTPS ingress to port 8081.
# The Process API is called over HTTPS at its CloudHub URL. processApi.host is
# supplied at deployment (GitHub variable PRC_API_HOST), because CloudHub assigns it.
http:
  port: "8081"

processApi:
  protocol: "HTTPS"
  port: "443"
# processApi.clientId and processApi.clientSecret (secure) are deployment properties:
# this app's client application for the Process API (docs/api-manager.md).
# Empty client ID: no credentials are sent.
