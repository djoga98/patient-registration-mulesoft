# Settings shared by every environment. Environment files must not repeat these keys.
http:
  host: "0.0.0.0"

api:
  basePath: "/api/*"

db:
  driverClassName: "org.postgresql.Driver"
  queryTimeoutSeconds: "10"
  pool:
    maxSize: "5"
    maxWaitMillis: "5000"

search:
  # Upper bound on the records one search returns (ordered by patient ID).
  maxResults: "100"
